# Builds the Control Center from a clean checkout on every OS we support, so a file that exists
# only on someone's PC (gitignored by mistake, never committed) fails here instead of for the
# next person who clones the repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-center:
    env:
      CONTROL_CENTER_BACKGROUND: 'off'
      CONTROL_CENTER_OFFLINE: '1'
    name: Control Center (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash everywhere (Git Bash on Windows): the Windows default, PowerShell, can fail a step
        # after npm has finished successfully.
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Isolate build state
        run: |
          echo "WORKSPACE_ROOT=$RUNNER_TEMP/control-center-build-fixture" >> "$GITHUB_ENV"
          echo "DATABASE_PATH=$RUNNER_TEMP/control-center-build-fixture/build.db" >> "$GITHUB_ENV"
          echo "CONTROL_CENTER_ENV_FILE=$RUNNER_TEMP/control-center-build-fixture/.env.local" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install fixture browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser smoke against disposable state and mock n8n
        if: runner.os == 'Linux'
        run: npm run test:browser

  scripts:
    name: Workspace scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts and hooks
        run: for f in scripts/*.mjs scripts/lib/*.mjs scripts/hooks/*.mjs; do node --check "$f"; done
      - name: Check custom skills and documented export examples
        run: node scripts/check-skills.mjs
      - name: Scaffold a project into a temp folder
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          root="$RUNNER_TEMP/projects"
          mkdir -p "$root"
          node scripts/new-project.mjs --name ci-smoke-test --client "CI" --no-website --projects-root "$root"
          test -f "$root/ci-smoke-test/README.md"
          test -f "$root/ci-smoke-test/documentation/CHANGELOG.md"
          test -d "$root/ci-smoke-test/.git"
          test ! -d "$root/ci-smoke-test/website"
          ! grep -R "{{PROJECT_SLUG}}" "$root/ci-smoke-test"
      - name: First-time setup with the demo project
        run: |
          node scripts/setup.mjs --demo
          test -f .claude/skills/n8n-workflow-export/SKILL.md
          test -f .agents/skills/n8n-workflow-export/SKILL.md
          test -f AGENTS.local.md
          grep -Eq '^INGEST_TOKEN=[0-9a-f]{48}$' app/.env.local
          test -f "n8n workflows/demo-lead-intake/workflows/01-receive-lead.json"
          node scripts/setup.mjs --demo   # re-running changes nothing
